apiVersion: v1
kind: Service
metadata:
  name: kedify-predictor
  labels:
    {{- include "kedify-predictor.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      {{- with .Values.service.nodePort }}
      nodePort: {{ . }}
      {{- end }}
      protocol: TCP
  selector:
    {{- include "kedify-predictor.selectorLabels" . | nindent 4 }}
